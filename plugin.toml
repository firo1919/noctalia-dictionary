id           = "firomsa/dictionary"
name         = "Dictionary"
version      = "0.2.0"
plugin_api   = 14
author       = "Firomsa"
license      = "MIT"
icon         = "vocabulary"
description  = "Fast offline dictionary. Select any text on screen with your mouse, or look up pre-selected words instantly with automatic clipboard copy and definition cards."
dependencies = ["wl-paste", "python3"]
tags         = ["utility", "productivity", "dictionary", "offline"]

# ── General Settings ──────────────────────────────────────────────────────────

[[setting]]
key             = "copy_to_clipboard"
type            = "bool"
label_key       = "settings.copy_to_clipboard.label"
description_key = "settings.copy_to_clipboard.description"
default         = true

[[setting]]
key             = "show_notification"
type            = "bool"
label_key       = "settings.show_notification.label"
description_key = "settings.show_notification.description"
default         = true

[[setting]]
key             = "show_panel_on_lookup"
type            = "bool"
label_key       = "settings.show_panel_on_lookup.label"
description_key = "settings.show_panel_on_lookup.description"
default         = true

[[setting]]
key             = "selection_timeout_seconds"
type            = "int"
label_key       = "settings.selection_timeout.label"
description_key = "settings.selection_timeout.description"
default         = 15
min             = 5
max             = 60

# ── Panel ─────────────────────────────────────────────────────────────────────

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 460
height          = 540
placement       = "attached"
position        = "auto"
open_near_click = true

# ── Bar Widget ────────────────────────────────────────────────────────────────

[[widget]]
id    = "widget"
entry = "widget.luau"

  [widget.actions]
  left  = "panel-toggle firomsa/dictionary:panel"
  right = "exec noctalia msg panel-toggle firomsa/dictionary:panel"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "vocabulary"
