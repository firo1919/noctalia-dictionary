id           = "firomsa/dictionary"
name         = "Dictionary"
version      = "0.1.0"
plugin_api   = 14
author       = "Firomsa"
license      = "MIT"
icon         = "vocabulary"
description  = "Fast offline dictionary with screen OCR selection, instant definition popout, and clipboard copy."
dependencies = ["grim", "slurp", "tesseract", "python3"]
tags         = ["utility", "productivity", "dictionary", "ocr"]

# ── General Settings ──────────────────────────────────────────────────────────

[[setting]]
key             = "copy_to_clipboard"
type            = "bool"
label_key       = "settings.copy_to_clipboard.label"
description_key = "settings.copy_to_clipboard.description"
default         = true

[[setting]]
key             = "show_notification"
type            = "bool"
label_key       = "settings.show_notification.label"
description_key = "settings.show_notification.description"
default         = true

[[setting]]
key             = "show_panel_on_lookup"
type            = "bool"
label_key       = "settings.show_panel_on_lookup.label"
description_key = "settings.show_panel_on_lookup.description"
default         = true

[[setting]]
key             = "psm"
type            = "select"
label_key       = "settings.psm.label"
description_key = "settings.psm.description"
default         = "6"
options = [
  { value = "6", label_key = "settings.psm.options.block" },
  { value = "7", label_key = "settings.psm.options.line" },
  { value = "8", label_key = "settings.psm.options.word" },
]

# ── Panel ─────────────────────────────────────────────────────────────────────

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 460
height          = 540
placement       = "attached"
position        = "auto"
open_near_click = true

# ── Bar Widget ────────────────────────────────────────────────────────────────

[[widget]]
id    = "widget"
entry = "widget.luau"

  [widget.actions]
  left  = "panel-toggle firomsa/dictionary:panel"
  right = "exec noctalia msg panel-toggle firomsa/dictionary:panel"

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "vocabulary"
